<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Plana Core Dashboard</title>
  <style data-plana-boot="true">
    :root {
      color-scheme: light dark;
      --bg: #eef3fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #65748b;
      --line: #d9e2ef;
      --primary: #2563eb;
    }

    html[data-theme="dark"] {
      --bg: #0b1020;
      --panel: #141b2b;
      --text: #eef4ff;
      --muted: #93a4bb;
      --line: #485674;
      --primary: #6da8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(420px, calc(100vw - 32px));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.3;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    #retry {
      display: none;
      margin-top: 14px;
      border: 0;
      border-radius: 6px;
      background: var(--primary);
      color: #fff;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Plana Core Dashboard</h1>
    <p id="status">正在通过 AstrBot 插件页加载控制台。</p>
    <button id="retry" type="button">重试</button>
  </main>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const retryEl = document.getElementById("retry");

    function fail(message) {
      statusEl.textContent = message;
      retryEl.style.display = "inline-block";
    }

    function mountDashboard(html) {
      if (typeof html !== "string" || !html.includes("plana-web-shell")) {
        throw new Error("Dashboard HTML 响应无效");
      }
      const parsed = new DOMParser().parseFromString(html, "text/html");
      const runtimeScripts = Array.from(parsed.querySelectorAll("script"));
      runtimeScripts.forEach((node) => node.remove());
      document.documentElement.lang = parsed.documentElement.lang || "zh-CN";
      document.title = parsed.title || document.title;
      document.head
        .querySelectorAll("[data-plana-runtime], [data-plana-boot]")
        .forEach((node) => node.remove());
      parsed.head.querySelectorAll("style, link[rel='stylesheet']").forEach((node) => {
        const clone = node.cloneNode(true);
        clone.setAttribute("data-plana-runtime", "true");
        document.head.appendChild(clone);
      });
      document.body.replaceChildren(...Array.from(parsed.body.childNodes));
      runtimeScripts.forEach((node) => {
        const script = document.createElement("script");
        for (const attr of node.attributes) {
          script.setAttribute(attr.name, attr.value);
        }
        script.textContent = node.textContent || "";
        document.body.appendChild(script);
      });
    }

    async function boot() {
      retryEl.style.display = "none";
      statusEl.textContent = "正在通过 AstrBot 插件页加载控制台。";
      const bridge = window.AstrBotPluginPage;
      if (!bridge) {
        fail("AstrBot 插件页桥接未就绪，请刷新 Dashboard 后重试。");
        return;
      }
      try {
        await bridge.ready();
        window.__planaPluginPageBridge = bridge;
        mountDashboard(await bridge.apiGet("dashboard"));
      } catch (error) {
        fail((error && error.message) || "Plana Core Dashboard 加载失败");
      }
    }

    retryEl.addEventListener("click", boot);
    boot();
  </script>
</body>
</html>
